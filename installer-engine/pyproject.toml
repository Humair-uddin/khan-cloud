[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "khan-cloud-installer"
version = "0.9.1"
description = "Manifest-driven installer engine for Khan Cloud"
requires-python = ">=3.12"
dependencies = [
  "PyYAML==6.0.3",
  "pydantic==2.13.4",
    "cryptography==49.0.0",
]

[project.scripts]
kc-installer = "kc_installer.cli:main"

[tool.setuptools]
packages = ["kc_installer"]
