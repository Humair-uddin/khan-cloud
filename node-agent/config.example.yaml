agent:
  node_name: KC-NODE-01
  control_plane_url: http://192.168.18.100:8000
  heartbeat_interval_seconds: 30
  request_timeout_seconds: 10
  log_level: INFO
  state_directory: /var/lib/khan-cloud-agent
  plugin_directory: /etc/khan-cloud-agent/plugins
  observation_only: true

security:
  deployment_enrollment_code: "REPLACE_WITH_DEPLOYMENT_ENROLLMENT_CODE"
  enrollment_token: ""  # legacy fallback only
  verify_tls: false

enrollment:
  endpoint: /api/v1/nodes/register

heartbeat:
  enabled: false
  endpoint: /api/v1/nodes/heartbeat

telemetry:
  enabled: true
  endpoint: /api/v1/nodes/installation-events
  installer_database_path: /opt/khan-cloud/state/installer/installer.db

gaming:
  enabled: false
  execution_backend: none
  streaming_backend: none
  session_broker_mode: existing
  session_broker_username: KhanGaming
  sunshine_api_url: https://127.0.0.1:47990
  sunshine_api_username: ""
  sunshine_api_password: ""
  sunshine_verify_tls: false
  vdd_template_path: C:\ProgramData\KhanCloud\VirtualDisplay\RuntimeConfig\khan-vdd-settings.xml
  vdd_target_root: C:\ProgramData\KhanCloud\VirtualDisplay
